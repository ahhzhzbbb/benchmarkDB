# Query-heavy benchmark profile
# WARNING: This is a SYNTHETIC workload. Ratios do NOT represent production traffic.

database:
  type: redis

workload:
  type: mixed
  operations:
    get: 20
    set: 10
    delete: 5
    ttl: 0
    equality_query: 40
    range_query: 25

dataset:
  key_count: 500000
  value_size: 1024
  seed: 12345
  namespace: benchmark
  set: session
  string_cardinality: 1000
  numeric_min: 1700000000
  numeric_max: 1710000000

benchmark:
  warmup: "10s"
  duration: "60s"
  concurrency: 50
  phases:
    - connectivity
    - mixed
  scenario: equal_resource

output:
  format: both
  file: "/tmp/benchmark-query-heavy.json"
