# Kubernetes Job manifest for running the benchmark (Section 21).
#
# Usage:
#   kubectl apply -f benchmark-job.yaml
#
# The job runs a single benchmark, writes results to stdout and optionally
# to a mounted volume, then exits. The job can be deleted after completion.
#
# IMPORTANT: Adjust the following before running:
#   1. ConfigMap name and data (or mount a custom config file).
#   2. Database connection endpoints.
#   3. Resource limits for the benchmark client pod.
#   4. The image name/tag.
apiVersion: v1
kind: ConfigMap
metadata:
  name: benchmark-config
  namespace: default
data:
  benchmark.yaml: |
    database:
      type: redis
    redis:
      startup_nodes:
        - redis-cluster-0.redis-cluster-headless:6379
        - redis-cluster-1.redis-cluster-headless:6379
        - redis-cluster-2.redis-cluster-headless:6379
    workload:
      type: mixed
      operations:
        get: 50
        set: 20
        delete: 10
        equality_query: 15
        range_query: 5
    dataset:
      key_count: 100000
      value_size: 1024
      seed: 12345
      namespace: benchmark
      set: session
      string_cardinality: 1000
      numeric_min: 1700000000
      numeric_max: 1710000000
    benchmark:
      warmup: "10s"
      duration: "60s"
      concurrency: 50
      phases:
        - connectivity
        - single
        - mixed
      scenario: equal_resource
    output:
      format: both
      file: "/results/benchmark-result.json"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-benchmark
  namespace: default
  labels:
    app: db-benchmark
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: db-benchmark
    spec:
      restartPolicy: Never
      containers:
        - name: benchmark
          image: db-benchmark:latest
          imagePullPolicy: IfNotPresent
          command:
            - benchmark
            - run
            - --config
            - /config/benchmark.yaml
          env:
            # Expose Kubernetes node name for metadata collection (Section 15, 16).
            - name: KUBERNETES_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: results
              mountPath: /results
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
      volumes:
        - name: config
          configMap:
            name: benchmark-config
        - name: results
          emptyDir: {}
